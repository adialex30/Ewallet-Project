server.port=${PORT:8080}

spring.application.name=simple-ewallet-system
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:mem:ewalletdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=b7e4a92f6c81d35e9047af1c9d62d4e9153f7a2c8b41d6e9057af3c8b62d4e9
jwt.expiration=86400000

app.transaction.max-amount=100000000

midtrans.server-key=${MIDTRANS_SERVER_KEY:SB-Mid-server-YOUR_DUMMY_KEY}
midtrans.client-key=${MIDTRANS_CLIENT_KEY:SB-Mid-client-YOUR_DUMMY_KEY}
midtrans.is-production=${MIDTRANS_IS_PRODUCTION:false}

spring.jackson.mapper.sort-properties-alphabetically=false