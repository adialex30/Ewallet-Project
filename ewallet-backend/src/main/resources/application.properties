spring.application.name=simple-ewallet-system

# ===== Database =====
# Default: H2 in-memory (local/dev). To use PostgreSQL or MySQL, override these
# 4 properties (e.g. via environment variables or a separate application-prod.properties)
# and add nothing else - the drivers are already on the classpath.
#
# PostgreSQL example:
#   spring.datasource.url=jdbc:postgresql://localhost:5432/ewallet
#   spring.datasource.driverClassName=org.postgresql.Driver
#   spring.datasource.username=postgres
#   spring.datasource.password=postgres
#
# MySQL example:
#   spring.datasource.url=jdbc:mysql://localhost:3306/ewallet
#   spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
#   spring.datasource.username=root
#   spring.datasource.password=root

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:mem:ewalletdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
jwt.secret=b7e4a92f6c81d35e9047af1c9d62d4e9153f7a2c8b41d6e9057af3c8b62d4e9
jwt.expiration=86400000

# ===== Transaction rules =====
# Max nominal (whole number, IDR) allowed per topup/withdraw/transfer request.
app.transaction.max-amount=100000000

# ===== Midtrans Payment Gateway =====
# Get these from https://dashboard.midtrans.com (Settings > Access Keys).
# Sandbox keys by default - switch midtrans.is-production=true and use
# production keys when going live.
midtrans.server-key=${MIDTRANS_SERVER_KEY}
midtrans.client-key=${MIDTRANS_CLIENT_KEY}
midtrans.is-production=false

spring.jackson.mapper.sort-properties-alphabetically=false
